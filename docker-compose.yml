services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: examsystem
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d examsystem"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --http-port=8081 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8081:8081"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import   # realm-export.json auto-imports on first start

volumes:
  pgdata:
