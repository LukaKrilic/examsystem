spring:
  application:
    name: examsystem
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/examsystem
    username: exam
    password: exam
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

exam:
  api-key: dev-api-key
  screenshot-dir: ./screenshots
